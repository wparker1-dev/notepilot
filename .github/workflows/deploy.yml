name: Deploy NotePilot to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build website using GitHub Actions secret
        env:
          NOTEPILOT_GEMINI_API_KEY: ${{ secrets.NOTEPILOT_GEMINI_API_KEY }}
        run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
