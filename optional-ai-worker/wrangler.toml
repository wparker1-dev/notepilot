name = "notepilot-ai"
main = "worker.js"
compatibility_date = "2026-11-16"

# Your API key is NOT stored here. Upload GEMINI_API_KEY via Wrangler secrets.
[vars]
ALLOWED_ORIGIN = "https://wparker1-dev.github.io"
GEMINI_MODEL = "gemini-3.5-flash-lite"
DAILY_LIMIT = "12"

# Create with: npx.cmd wrangler kv namespace create RATE_LIMIT
# Then replace the ID below with the real ID Cloudflare prints.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
